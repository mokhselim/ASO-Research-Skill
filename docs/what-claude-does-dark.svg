<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="960" height="360" rx="16" fill="#0d1117"/><rect x="24" y="36" width="168" height="104" rx="52.0" fill="#161b22" stroke="#30363d"/><text x="108.0" y="82" text-anchor="middle" font-size="13" fill="#8b949e">You type</text><text x="108.0" y="106" text-anchor="middle" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#58a6ff">/aso-keywords</text><line x1="196" y1="88.0" x2="228" y2="88.0" stroke="#484f58" stroke-width="2.5" stroke-linecap="round"/><path d="M227 81.0 L235 88.0 L227 95.0" fill="none" stroke="#484f58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="36" width="200" height="104" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="266" cy="64" r="13" fill="#1f3a5f"/><text x="266" y="69" text-anchor="middle" font-size="13" font-weight="700" fill="#58a6ff">1</text><text x="288" y="69" font-size="15" font-weight="700" fill="#e6edf3">Tests your words</text><text x="258" y="98" font-size="13" fill="#8b949e">in every store you choose,</text><text x="258" y="118" font-size="13" fill="#8b949e">exactly as you typed them</text><line x1="444" y1="88.0" x2="476" y2="88.0" stroke="#484f58" stroke-width="2.5" stroke-linecap="round"/><path d="M475 81.0 L483 88.0 L475 95.0" fill="none" stroke="#484f58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="488" y="36" width="200" height="104" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="514" cy="64" r="13" fill="#1f3a5f"/><text x="514" y="69" text-anchor="middle" font-size="13" font-weight="700" fill="#58a6ff">2</text><text x="536" y="69" font-size="15" font-weight="700" fill="#e6edf3">Looks at competitors</text><text x="506" y="98" font-size="13" fill="#8b949e">per country: what words do</text><text x="506" y="118" font-size="13" fill="#8b949e">the apps ranking there use?</text><line x1="692" y1="88.0" x2="724" y2="88.0" stroke="#484f58" stroke-width="2.5" stroke-linecap="round"/><path d="M723 81.0 L731 88.0 L723 95.0" fill="none" stroke="#484f58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="736" y="36" width="200" height="104" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="762" cy="64" r="13" fill="#1f3a5f"/><text x="762" y="69" text-anchor="middle" font-size="13" font-weight="700" fill="#58a6ff">3</text><text x="784" y="69" font-size="15" font-weight="700" fill="#e6edf3">Finds native words</text><text x="754" y="98" font-size="13" fill="#8b949e">local terms in the local</text><text x="754" y="118" font-size="13" fill="#8b949e">language, still unclaimed</text><path d="M836 140 V168.0 Q836 180.0 824 180.0 H352 Q340 180.0 340 192.0 V210" fill="none" stroke="#484f58" stroke-width="2.5" stroke-linecap="round"/><path d="M333 203 L340 211 L347 203" fill="none" stroke="#484f58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="220" width="200" height="104" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="266" cy="248" r="13" fill="#1f3a5f"/><text x="266" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#58a6ff">4</text><text x="288" y="253" font-size="15" font-weight="700" fill="#e6edf3">Scores every word</text><text x="258" y="282" font-size="13" fill="#8b949e">how cheap is it to rank?</text><text x="258" y="302" font-size="13" fill="#8b949e">fewer title owners wins</text><line x1="444" y1="272.0" x2="476" y2="272.0" stroke="#484f58" stroke-width="2.5" stroke-linecap="round"/><path d="M475 265.0 L483 272.0 L475 279.0" fill="none" stroke="#484f58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="488" y="220" width="200" height="104" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="514" cy="248" r="13" fill="#1f3a5f"/><text x="514" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#58a6ff">5</text><text x="536" y="253" font-size="15" font-weight="700" fill="#e6edf3">Builds your fields</text><text x="506" y="282" font-size="13" fill="#8b949e">title · subtitle · keywords,</text><text x="506" y="302" font-size="13" fill="#8b949e">one set per locale</text><line x1="692" y1="272.0" x2="724" y2="272.0" stroke="#484f58" stroke-width="2.5" stroke-linecap="round"/><path d="M723 265.0 L731 272.0 L723 279.0" fill="none" stroke="#484f58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="736" y="220" width="200" height="104" rx="52.0" fill="#1a3a26" stroke="#1a3a26"/><text x="836.0" y="266" text-anchor="middle" font-size="13" fill="#8b949e">You get</text><text x="836.0" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#3fb950">ready-to-paste fields</text></svg>
