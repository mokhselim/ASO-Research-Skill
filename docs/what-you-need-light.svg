<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="300" rx="16" fill="#ffffff"/>
  <rect x="24" y="24" width="290" height="252" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="44" y="60" font-size="18" font-weight="700" fill="#0f172a">Claude Code</text><rect x="195" y="44" width="99" height="22" rx="11" fill="#dcfce7"/><text x="244.5" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">YOU HAVE IT</text><text x="44" y="96" font-size="13" fill="#0f172a">Where you type the command.</text><text x="44" y="118" font-size="13" fill="#0f172a"></text><text x="44" y="140" font-size="13" fill="#0f172a">Free with your Claude plan.</text><text x="44" y="162" font-size="13" fill="#0f172a">Mac, Windows or Linux.</text><text x="44" y="250" font-size="12" fill="#64748b">claude.ai/code</text>
  <rect x="335" y="24" width="290" height="252" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="355" y="60" font-size="18" font-weight="700" fill="#0f172a">Astro</text><rect x="527" y="44" width="78" height="22" rx="11" fill="#fef3c7"/><text x="566.0" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">REQUIRED</text><text x="355" y="96" font-size="13" fill="#0f172a">The data. Keyword popularity,</text><text x="355" y="118" font-size="13" fill="#0f172a">difficulty, who ranks where.</text><text x="355" y="140" font-size="13" fill="#0f172a"></text><text x="355" y="162" font-size="13" fill="#0f172a">Mac only (macOS 14+). Paid app.</text><text x="355" y="184" font-size="13" fill="#0f172a">Turn on its MCP Server once.</text><text x="355" y="250" font-size="12" fill="#64748b">tryastro.app</text>
  <rect x="646" y="24" width="290" height="252" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="666" y="60" font-size="18" font-weight="700" fill="#0f172a">Helm</text><rect x="838" y="44" width="78" height="22" rx="11" fill="#dbeafe"/><text x="877.0" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">OPTIONAL</text><text x="666" y="96" font-size="13" fill="#0f172a">Talks to App Store Connect.</text><text x="666" y="118" font-size="13" fill="#0f172a"></text><text x="666" y="140" font-size="13" fill="#0f172a">Lets the tool read your live</text><text x="666" y="162" font-size="13" fill="#0f172a">listing and publish the result.</text><text x="666" y="184" font-size="13" fill="#0f172a">Skip it — you can paste by hand.</text><text x="666" y="250" font-size="12" fill="#64748b">helm-app.com</text>
</svg>
