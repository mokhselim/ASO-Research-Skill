<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="960" height="360" rx="16" fill="#ffffff"/><rect x="24" y="36" width="168" height="104" rx="52.0" fill="#f8fafc" stroke="#e2e8f0"/><text x="108.0" y="82" text-anchor="middle" font-size="13" fill="#64748b">You type</text><text x="108.0" y="106" text-anchor="middle" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2563eb">/aso-keywords</text><line x1="196" y1="88.0" x2="228" y2="88.0" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><path d="M227 81.0 L235 88.0 L227 95.0" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="36" width="200" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="266" cy="64" r="13" fill="#dbeafe"/><text x="266" y="69" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">1</text><text x="288" y="69" font-size="15" font-weight="700" fill="#0f172a">Tests your words</text><text x="258" y="98" font-size="13" fill="#64748b">in the US store, exactly</text><text x="258" y="118" font-size="13" fill="#64748b">as you typed them</text><line x1="444" y1="88.0" x2="476" y2="88.0" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><path d="M475 81.0 L483 88.0 L475 95.0" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="488" y="36" width="200" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="514" cy="64" r="13" fill="#dbeafe"/><text x="514" y="69" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">2</text><text x="536" y="69" font-size="15" font-weight="700" fill="#0f172a">Looks at competitors</text><text x="506" y="98" font-size="13" fill="#64748b">what words do apps</text><text x="506" y="118" font-size="13" fill="#64748b">ranking for yours use?</text><line x1="692" y1="88.0" x2="724" y2="88.0" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><path d="M723 81.0 L731 88.0 L723 95.0" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="736" y="36" width="200" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="762" cy="64" r="13" fill="#dbeafe"/><text x="762" y="69" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">3</text><text x="784" y="69" font-size="15" font-weight="700" fill="#0f172a">Looks at countries</text><text x="754" y="98" font-size="13" fill="#64748b">apps that rank there, not</text><text x="754" y="118" font-size="13" fill="#64748b">in the US — their words</text><path d="M836 140 V168.0 Q836 180.0 824 180.0 H352 Q340 180.0 340 192.0 V210" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><path d="M333 203 L340 211 L347 203" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="220" width="200" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="266" cy="248" r="13" fill="#dbeafe"/><text x="266" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">4</text><text x="288" y="253" font-size="15" font-weight="700" fill="#0f172a">Scores every word</text><text x="258" y="282" font-size="13" fill="#64748b">how cheap is it to rank?</text><text x="258" y="302" font-size="13" fill="#64748b">fewer title owners wins</text><line x1="444" y1="272.0" x2="476" y2="272.0" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><path d="M475 265.0 L483 272.0 L475 279.0" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="488" y="220" width="200" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="514" cy="248" r="13" fill="#dbeafe"/><text x="514" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">5</text><text x="536" y="253" font-size="15" font-weight="700" fill="#0f172a">Builds your fields</text><text x="506" y="282" font-size="13" fill="#64748b">title · subtitle · keywords</text><text x="506" y="302" font-size="13" fill="#64748b">OLD vs NEW if you have one</text><line x1="692" y1="272.0" x2="724" y2="272.0" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><path d="M723 265.0 L731 272.0 L723 279.0" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="736" y="220" width="200" height="104" rx="52.0" fill="#dcfce7" stroke="#dcfce7"/><text x="836.0" y="266" text-anchor="middle" font-size="13" fill="#64748b">You get</text><text x="836.0" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">ready-to-paste fields</text></svg>
