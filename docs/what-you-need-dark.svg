<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="300" rx="16" fill="#0d1117"/>
  <rect x="24" y="24" width="290" height="252" rx="12" fill="#161b22" stroke="#30363d"/><text x="44" y="60" font-size="18" font-weight="700" fill="#e6edf3">Claude Code</text><rect x="195" y="44" width="99" height="22" rx="11" fill="#1a3a26"/><text x="244.5" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="#3fb950">YOU HAVE IT</text><text x="44" y="96" font-size="13" fill="#e6edf3">Where you type the command.</text><text x="44" y="118" font-size="13" fill="#e6edf3"></text><text x="44" y="140" font-size="13" fill="#e6edf3">Free with your Claude plan.</text><text x="44" y="162" font-size="13" fill="#e6edf3">Mac, Windows or Linux.</text><text x="44" y="250" font-size="12" fill="#8b949e">claude.ai/code</text>
  <rect x="335" y="24" width="290" height="252" rx="12" fill="#161b22" stroke="#30363d"/><text x="355" y="60" font-size="18" font-weight="700" fill="#e6edf3">Astro</text><rect x="527" y="44" width="78" height="22" rx="11" fill="#3b2f0b"/><text x="566.0" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="#d29922">REQUIRED</text><text x="355" y="96" font-size="13" fill="#e6edf3">The data. Keyword popularity,</text><text x="355" y="118" font-size="13" fill="#e6edf3">difficulty, who ranks where.</text><text x="355" y="140" font-size="13" fill="#e6edf3"></text><text x="355" y="162" font-size="13" fill="#e6edf3">Mac only (macOS 14+). Paid app.</text><text x="355" y="184" font-size="13" fill="#e6edf3">Turn on its MCP Server once.</text><text x="355" y="250" font-size="12" fill="#8b949e">tryastro.app</text>
  <rect x="646" y="24" width="290" height="252" rx="12" fill="#161b22" stroke="#30363d"/><text x="666" y="60" font-size="18" font-weight="700" fill="#e6edf3">Helm</text><rect x="838" y="44" width="78" height="22" rx="11" fill="#1f3a5f"/><text x="877.0" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="#58a6ff">OPTIONAL</text><text x="666" y="96" font-size="13" fill="#e6edf3">Talks to App Store Connect.</text><text x="666" y="118" font-size="13" fill="#e6edf3"></text><text x="666" y="140" font-size="13" fill="#e6edf3">Lets the tool read your live</text><text x="666" y="162" font-size="13" fill="#e6edf3">listing and publish the result.</text><text x="666" y="184" font-size="13" fill="#e6edf3">Skip it — you can paste by hand.</text><text x="666" y="250" font-size="12" fill="#8b949e">helm-app.com</text>
</svg>
